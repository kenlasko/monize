name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Two publish paths share this file:
  #
  #   * Preview (push to main): builds a lightweight image so merged work is
  #     pullable before a formal release (issue #727), moving a single
  #     multi-arch `:beta` tag. No version bump, no GitHub release, no
  #     cosign/SBOM. Per-PR `:pr-<number>` images were published here too until
  #     they were retired -- see the preview section below for why.
  #
  #   * Release (workflow_dispatch): the formal release. Trigger from the
  #     Actions tab (or `gh workflow run "CI Pipeline" --ref main`) when you
  #     actually want a release: it bumps the version, builds/signs/scans/pushes
  #     the versioned + `:latest` images, and cuts a GitHub release. The inputs
  #     below choose the version bump and let you supply your own release notes
  #     (see docs/release-notes/README.md).
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump (ignored when an explicit "version" is given)'
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: 'Explicit version, e.g. 1.11.0 (overrides "release_type"; blank = bump)'
        type: string
        default: ''
      release_notes:
        description: 'Release notes (Markdown). Blank = use docs/release-notes/<version>.md, else GitHub auto-notes'
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only access for all jobs. Jobs that need more (e.g. the
# build-and-push job which pushes a version commit and GHCR images) opt in
# with their own `permissions:` block. See CWE-275.
permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # tsconfig.json excludes test/ (it drives the build and pins rootDir to
      # src/), so `tsc --noEmit` above never type-checked the test tree. Four
      # `test/*.e2e-spec.ts` suites sat uncompilable for over a week as a result
      # -- ESLint's glob covers the directory but a namespace import called as a
      # function is a type error, not a lint error, and CI runs neither
      # `test:e2e` nor a typecheck that reaches them.
      - run: npm run typecheck
      # Migration idempotency: every migration body must be a no-op when
      # re-applied to an up-to-date database, or a half-applied migration
      # crash-loops the backend at startup (task B1). Self-test first, then lint.
      - run: npm run push:client:test
      - run: npm run push:tls:test
      - run: npm run migration:lint:test
      - run: npm run migration:lint

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: backend-unit-coverage
          path: backend/coverage/

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Pinned by digest to satisfy zizmor's unpinned-images audit. Refresh
        # alongside production postgres bumps so CI matches what we ship.
        image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
        env:
          POSTGRES_DB: monize_test
          POSTGRES_USER: monize_test
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: monize_test
      DATABASE_USER: monize_test
      DATABASE_PASSWORD: test_password
      JWT_SECRET: test-jwt-secret-for-ci-minimum-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      # Fail if the generated pseudo-locale (xx) has drifted from the English
      # source. Run `npm run i18n:pseudo` to regenerate after editing en/*.json.
      - run: npm run i18n:check

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:cov
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: frontend-coverage
          path: frontend/coverage/

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      # The gate's own logic, before it is trusted to gate anything. It is the
      # part that decides whether a red X means "you shipped a vulnerability"
      # or "npmjs is down", and it costs ~100ms.
      - name: Verify the audit gate
        run: node --test scripts/npm-audit-gate.test.mjs
      # Blocking gate: what we actually ship. A high-severity advisory in a
      # runtime dependency fails the build.
      #
      # Not a bare `npm audit`: that exits 1 both for an advisory and for an
      # advisories endpoint it could not reach, so an npmjs outage was
      # indistinguishable from a vulnerability (twice on PR #1308, while
      # `npm ci` in this same job resolved every package). The gate reads
      # `--json`, retries ONLY a no-answer, and still fails if the endpoint
      # never answers -- "we could not verify" is not "verified clean" -- but
      # now says which of the two happened. See scripts/lib/npm-audit-gate.mjs.
      - name: Audit production dependencies (blocking)
        run: |
          (cd backend && npm ci)
          (cd frontend && npm ci)
          node scripts/npm-audit-gate.mjs
      # Visibility only: build tooling (eslint, jest, the Nest CLI) never
      # reaches a user, and its advisories are routinely unfixable for weeks --
      # the current one, brace-expansion GHSA-mh99-v99m-4gvg, has no patched
      # 1.x release at all, and forcing the fixed 5.x onto minimatch@3 breaks
      # it outright. Blocking every PR on that is noise, but silence would be
      # worse, so the full audit still runs and its findings stay in the log.
      - name: Audit dev dependencies (informational)
        continue-on-error: true
        run: |
          cd backend && npm audit --audit-level=high
          cd ../frontend && npm audit --audit-level=high

  license-check:
    name: License Compliance (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      # Allowed: permissive (MIT, BSD, ISC, Apache-2.0, 0BSD, Unlicense,
      # Unicode-DFS-2016/Unicode-3.0 -- the Unicode Data Files license,
      # BSD-equivalent, accepted by ASF and FSF; e.g. make-plural via
      # nestjs-i18n);
      # the project's own license (AGPL-3.0 family); LGPL variants (compatible
      # with AGPL since npm dependency = dynamic-linking equivalent which LGPL
      # permits; e.g. @img/sharp-libvips-*); MPL-2.0 (weak copyleft, AGPL
      # compatible; e.g. lightningcss, dompurify); Zlib (e.g. pako).
      #
      # MIT* matches packages whose license is inferred from a LICENSE file
      # but not declared via SPDX (currently pause, rgbcolor) -- still MIT in
      # practice. Compound SPDX expressions are matched literally because
      # license-checker doesn't parse them; new ones will need to be added
      # as they appear.
      #
      # Disallowed: GPL-2.0/3.0 (incompatible network-use semantics),
      # proprietary, UNKNOWN, anything not listed.
      - name: Check licenses
        run: |
          npx --yes license-checker-rseidelsohn \
            --production \
            --excludePrivatePackages \
            --onlyAllow 'MIT;MIT-0;Apache-2.0;BSD-2-Clause;BSD-3-Clause;BSD;ISC;0BSD;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense;Unicode-DFS-2016;Unicode-3.0;Python-2.0;BlueOak-1.0.0;AGPL-3.0;AGPL-3.0-only;AGPL-3.0-or-later;LGPL-3.0;LGPL-3.0-or-later;LGPL-3.0-only;LGPL-2.1;LGPL-2.1-or-later;LGPL-2.1-only;MPL-2.0;Zlib;WTFPL;MIT*;(MIT AND BSD-3-Clause);(MIT AND Zlib);(MIT AND ISC);(MPL-2.0 OR Apache-2.0)'

  schema-drift:
    name: Schema vs Migrations Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Verify schema.sql matches migrations state
        run: scripts/verify-schema.sh

  frontend-bundle-size:
    name: Frontend Bundle Size
    runs-on: ubuntu-latest
    # Skip on the build-and-push commit so we don't double-build on main.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      pull-requests: write # so the bundle-size report can be posted as a PR comment (today it only writes to the job summary)
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
        env:
          # Same env the e2e build uses so the bundle reflects production output.
          NODE_ENV: production
      - name: Report bundle sizes
        run: |
          {
            echo "## Frontend bundle sizes"
            echo
            echo '| Path | Size |'
            echo '|------|------|'
            # Top 20 largest files under .next/static
            find .next/static -type f -printf '%s\t%P\n' \
              | sort -rn | head -20 \
              | awk '{ printf "| %s | %.1f KB |\n", $2, $1/1024 }'
            echo
            echo '### Totals'
            echo
            TOTAL_STATIC=$(du -sb .next/static | cut -f1)
            TOTAL_STANDALONE=$(du -sb .next/standalone 2>/dev/null | cut -f1 || echo 0)
            printf -- '- .next/static: **%.1f MB**\n' "$(echo "$TOTAL_STATIC/1048576" | bc -l)"
            printf -- '- .next/standalone: **%.1f MB**\n' "$(echo "$TOTAL_STANDALONE/1048576" | bc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  env-doc-check:
    name: Documentation vs Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
          # The migration-prefix check compares this branch's migrations against
          # the base branch's; a shallow clone has no base ref and the check
          # reports that it skipped rather than passing silently.
          fetch-depth: 0
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24
      - name: Verify env vars are documented
        run: node scripts/check-env-docs.mjs
      # The documented setup path must name files that exist and defaults that
      # match the manifests: the README's Quick Start pointed at a
      # `docker-compose.yml` this repository has never contained, and the Helm
      # install command at a chart directory that does not exist.
      - name: Verify documented paths and Helm defaults match the manifests
        run: node scripts/check-docs-manifests.mjs
      # A migration prefix that collides with one already on the base branch is
      # applied out of order on every database that recorded the other filename
      # -- and `database/CLAUDE.md` stating the rule in prose did not stop two
      # branches from both taking the next counter value (issue #1277). New
      # migrations therefore carry a UTC timestamp prefix, which cannot collide;
      # this check refuses a new file named under the retired NNN_ scheme. The
      # "what did this branch add" half needs the base ref, hence fetch-depth 0.
      - name: Verify migration prefixes are unique and timestamp-named
        run: node scripts/check-migration-prefixes.mjs
      # The GHCR prune sweep DELETES package versions, and its predicate is the
      # only thing standing between "clear the retired per-PR tags" and
      # unpublishing `:latest`: a version can wear several tags at once, so a
      # digest tagged both `pr-1290` and `beta` must be kept. Nothing else
      # exercises that -- the script itself only runs on a schedule, against
      # the live registry.
      - name: Verify the GHCR version classifier
        run: node --test scripts/ghcr-version-class.test.mjs

  helm-chart:
    name: Helm Chart Lint & Render
    runs-on: ubuntu-latest
    # The chart is a released deployment artifact, and nothing verified it: a
    # template/value mismatch can ship alongside signed images while every other
    # check stays green. Lint plus a render of each documented value variant is
    # the cheap half of P7-010; a kind/k3d install with backup-volume
    # persistence remains open.
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      # Installed from the official release rather than via a third-party
      # action, so there is no extra action SHA to pin and keep fresh. The
      # tarball is checked against the checksum file published beside it: that
      # protects against a truncated or corrupted download, not against a
      # compromised release, which is the same trust boundary every
      # `setup-*` action sits behind.
      - name: Install Helm
        env:
          HELM_VERSION: v3.16.4
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          TARBALL="helm-${HELM_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "https://get.helm.sh/${TARBALL}"
          curl -fsSLO "https://get.helm.sh/${TARBALL}.sha256sum"
          sha256sum -c "${TARBALL}.sha256sum"
          tar -xzf "$TARBALL"
          install -m 0755 linux-amd64/helm /usr/local/bin/helm
          helm version --short
      - name: helm lint
        run: helm lint ./helm
      - name: Render default values
        # Keep the rendered output: the YAML-parse step below parses it (and the
        # variant renders below) rather than rendering the defaults a second time.
        # Assert the route the defaults turn on is actually present: parsing only
        # proves each rendered doc is valid, not that the value flag produced the
        # resource it exists to produce -- a template that silently rendered
        # nothing would leave the valid statefulsets/services and pass the parse.
        run: |
          helm template monize ./helm > "$RUNNER_TEMP/rendered.yaml"
          grep -q '^kind: HTTPRoute$' "$RUNNER_TEMP/rendered.yaml" \
            || { echo "default values rendered no HTTPRoute (httpRoute.enabled defaults true)"; exit 1; }
      # Each variant the README documents. Rendering only the defaults would
      # leave the Ingress and HTTPRoute paths -- which are mutually exclusive in
      # practice -- unexercised. Keep each variant's output too: the Ingress
      # resource never appears in the default render, so discarding it to
      # /dev/null would mean the one manifest a value flag turns on is the one
      # the parse step below never kind/apiVersion-checks. Assert its presence
      # here as well, since parsing a doc that never rendered cannot fail.
      - name: Render with Ingress enabled
        run: |
          helm template monize ./helm \
            --set ingress.enabled=true \
            --set httpRoute.enabled=false \
            --set ingress.className=nginx > "$RUNNER_TEMP/rendered-ingress.yaml"
          grep -q '^kind: Ingress$' "$RUNNER_TEMP/rendered-ingress.yaml" \
            || { echo "ingress.enabled=true rendered no Ingress -- the value flag is not turning the resource on"; exit 1; }
      - name: Render with HTTPRoute disabled
        run: helm template monize ./helm --set httpRoute.enabled=false > "$RUNNER_TEMP/rendered-minimal.yaml"
      # PyYAML happens to be present on the current ubuntu-latest image, which
      # is not the same as this job declaring it. An undeclared dependency that
      # disappears in a runner-image bump turns the check below into an
      # ImportError somebody has to diagnose, so install it explicitly and pin
      # the version.
      - name: Install PyYAML
        # --break-system-packages: ubuntu-latest ships an externally-managed
        # Python (PEP 668), which refuses a system-level `pip install` outright.
        # The flag exists in pip 23.0.1+, which every current GitHub-hosted
        # image ships; it keeps the install from being the thing that breaks on
        # a runner-image bump to a managed Python.
        run: python3 -m pip install --disable-pip-version-check --break-system-packages --quiet 'PyYAML==6.0.2'
      # A rendered manifest that helm accepts can still be invalid Kubernetes.
      # Parse every document -- across every rendered variant -- so a malformed
      # template fails here rather than at `kubectl apply` time on someone's
      # cluster. Globbing the variant files means the Ingress manifest, absent
      # from the default render, is checked too.
      - name: Parse rendered manifests as YAML
        run: |
          python3 - <<'PY'
          import os, sys, glob, yaml
          # Same base directory the render steps wrote to, so a self-hosted
          # runner with a persistent /tmp cannot feed a stale file into the glob.
          tmp = os.environ["RUNNER_TEMP"]
          files = sorted(glob.glob(os.path.join(tmp, "rendered*.yaml")))
          if not files:
              sys.exit("no rendered manifests found to parse")
          for path in files:
              with open(path) as fh:
                  docs = [d for d in yaml.safe_load_all(fh) if d]
              if not docs:
                  sys.exit(f"{path}: rendered chart produced no manifests")
              for d in docs:
                  if not isinstance(d, dict):
                      sys.exit(f"{path}: top-level document is not a mapping: {d!r}")
                  if "kind" not in d or "apiVersion" not in d:
                      sys.exit(f"{path}: manifest without kind/apiVersion: {d!r}")
              print(f"{path}: {len(docs)} manifest(s) parsed")
          PY

  zizmor-scan:
    name: Workflow Security Scan (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # for github/codeql-action/upload-sarif to publish zizmor findings to the Security tab
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          # This job only runs `uv tool install zizmor` -- there are no Python
          # dependency manifests to key a cache on, so leaving caching enabled
          # only produces setup-uv's "cache will never get invalidated" warning.
          enable-cache: false
      - name: Install zizmor
        run: uv tool install zizmor
      - name: Run zizmor
        run: zizmor --format sarif .github/workflows/ > zizmor.sarif || true
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@fb0994ef1c058010acf1efccff928b0a83b1ed54 # v4.32.6
        with:
          sarif_file: zizmor.sarif
          category: zizmor

  dockerfile-lint:
    name: Dockerfile Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yaml

  bearer-scan:
    name: Bearer Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Bearer
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          # We explicitly don't provide HTTPS out-of-the-box since most users self-host in environments where HTTPS is terminated at a reverse proxy, and we provide guidance on how to securely configure this in our docs. 
          # We also have some known exception messages that contain payee names which would otherwise be flagged as potential secrets, but we have determined that the risk of these being exploited is low and the value of having the full exception message in our logs outweighs the risk.
          skip-rule: "javascript_lang_logger_leak,javascript_express_https_protocol_missing,javascript_lang_exception" 
          # Exclude some false positives and low-risk findings that we are aware of and have accepted for now.
          # Each entry has a "review-by" date; the bearer-exceptions-review workflow
          # opens an issue when any entry is past due, so exceptions don't become permanent debt.
          #
          # A fingerprint is md5("<rule id>_<path>") plus an instance index, so an
          # accepted finding that moves file re-reports under a new id, and a finding
          # whose code was fixed simply stops being reported. Bearer prints the ids in
          # the list that it no longer detects; an id it names is dead weight, not an
          # exception, and belongs deleted (issue #1323 found three).
          #
          # The demo login. DEMO_MODE deployments publish their own credentials
          # (.env.example prints them, the login page pre-fills them), so the literal
          # is public by design and cannot be moved out of the source. What the
          # review changed is how many places spell it: the seed, the nightly reset,
          # the start-up probe and the client each had their own copy, so the value
          # now lives in one module per layer and a guard fails a second spelling
          # (backend/src/database/demo-credentials.spec.ts scans backend/src;
          # frontend/src/lib/demo-credentials.contract.test.ts scans frontend/src and
          # checks the two layers agree). The two ids below replace
          # b65bd7b1a0585cd1d0a326cdb09ce40d_0 (seed.service.ts) and
          # 95857358158e4664c01c05441df9f2a9_0 (login/page.tsx), which no longer hold
          # the literal.
