services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: monize-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monize}
      POSTGRES_USER: ${POSTGRES_USER:-monize_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monize_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monize_user} -d ${POSTGRES_DB:-monize}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: monize-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-monize}
      DATABASE_USER: ${POSTGRES_USER:-monize_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-monize_password}
      # Row-Level Security (defense-in-depth; off by default). See
      # docs/specs/row-level-security.md. Empty-safe so an untouched
      # .env boots unchanged.
      RLS_MODE: ${RLS_MODE:-off}
      DATABASE_APP_USER: ${DATABASE_APP_USER:-monize_app}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-}
      # Required: the backend refuses to start without a JWT_SECRET of at least
      # 32 characters, and warns (log, admin alert, banner) when it is a known
      # placeholder or predictable. Generate one with `openssl rand -base64 32`
      # and keep it stable: changing it makes stored authenticator (TOTP)
      # secrets unreadable, so 2FA users must sign in with a backup code or have
      # an admin reset their 2FA. See docs/backend/modules-and-runtime.md,
      # "Changing JWT_SECRET".
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-${PUBLIC_APP_URL:-http://localhost:3001}}
      MSN_API_KEY: ${MSN_API_KEY}
      # Authentication
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      FORCE_2FA: ${FORCE_2FA:-false}
      REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-30}
      # Reminder cron limits (empty values use backend defaults)
      UNIFIEDPUSH_PRIVATE_ENDPOINTS: ${UNIFIEDPUSH_PRIVATE_ENDPOINTS:-}
      NOTIFICATION_REMINDER_CLAIM_BATCH: ${NOTIFICATION_REMINDER_CLAIM_BATCH:-}
      NOTIFICATION_REMINDER_REEMIT_CONCURRENCY: ${NOTIFICATION_REMINDER_REEMIT_CONCURRENCY:-}
      # Backup
      BACKUP_CONTAINER_DIR: ${BACKUP_CONTAINER_DIR:-/data/backups}
      # Attachments (used by ATTACHMENT_STORAGE_PROVIDER=local)
      ATTACHMENT_CONTAINER_DIR: ${ATTACHMENT_CONTAINER_DIR:-/data/attachments}
      # Demo mode (optional)
      DEMO_MODE: ${DEMO_MODE:-false}
      # OIDC (optional)
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      # SMTP Configuration for Email Notifications
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM}
      # Required: the backend refuses to start without an ENCRYPTION_KEY of at
      # least 32 characters (`openssl rand -hex 32`). It encrypts everything
      # stored encrypted at rest (AI provider keys, emergency-access
      # credentials, the automatic-backup data keys). Keep it stable once set:
      # rotating it makes what is stored unreadable. AI_ENCRYPTION_KEY is the
      # former name and is still accepted, so an existing .env keeps working --
      # pass both and let the backend choose.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-}
      AI_DEFAULT_PROVIDER: ${AI_DEFAULT_PROVIDER:-}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-}
      AI_DEFAULT_API_KEY: ${AI_DEFAULT_API_KEY:-}
      AI_DEFAULT_BASE_URL: ${AI_DEFAULT_BASE_URL:-}
      # HTTP mode (optional)
      DISABLE_HTTPS_HEADERS: ${DISABLE_HTTPS_HEADERS:-true}
    volumes:
      - ./backend:/app
      - ./database:/database:ro
      - ./database/migrations:/app/migrations:ro
      # Release notes for the What's New digest (the ./backend:/app mount would
      # otherwise shadow the copy baked into the image).
      - ./docs/release-notes:/app/release-notes:ro
      # The user guide served by the in-app help API (the same shadowing applies
      # to the copy baked into the image at /app/help).
      - ./website/docs:/app/help:ro
      # Automatic backups are written to BACKUP_CONTAINER_DIR in the container.
      - ${BACKUP_HOST_DIR:-./monize/backups}:${BACKUP_CONTAINER_DIR:-/data/backups}
      # Attachments are written to ATTACHMENT_CONTAINER_DIR in the container
      # when ATTACHMENT_STORAGE_PROVIDER=local.
      - ${ATTACHMENT_HOST_DIR:-./monize/attachments}:${ATTACHMENT_CONTAINER_DIR:-/data/attachments}
      - /app/node_modules
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    networks:
      - finance-network
    command: sh -c "npm run build && node dist/db-init.js && node dist/db-migrate.js && if [ \"$$DEMO_MODE\" = 'true' ]; then node dist/database/seed.js; fi && npm run start:dev"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: monize-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_URL: http://backend:3000
      PUBLIC_APP_URL: http://localhost:3001
      DISABLE_HTTPS_HEADERS: ${DISABLE_HTTPS_HEADERS:-true}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    networks:
      - finance-network
    command: npm run dev


networks:
  finance-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
