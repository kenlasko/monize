<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Monize</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body data-state="busy">
    <div class="backdrop" aria-hidden="true">
      <span class="glow glow-a"></span>
      <span class="glow glow-b"></span>
      <span class="grid"></span>
    </div>
    <main>
      <header class="brand">
        <span class="mark">
          <span class="ring" aria-hidden="true"></span>
          <img src="monize-logo.svg" alt="" width="40" height="40" />
        </span>
        <h1>Monize</h1>
      </header>
      <div class="status">
        <p id="title" role="status" aria-live="polite"></p>
        <div id="progress" class="progress" aria-hidden="true">
          <span id="progress-fill" class="progress-fill"></span>
        </div>
      </div>
      <p id="detail" class="detail"></p>
      <pre id="log" class="log" hidden></pre>
      <div id="actions" class="actions" hidden>
        <button id="quit" type="button" class="secondary" hidden></button>
        <button id="retry" type="button" class="primary" hidden></button>
      </div>
    </main>
    <script src="splash-page.js"></script>
  </body>
</html>
