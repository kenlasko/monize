<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'"
    />
    <title>Monize</title>
    <link rel="stylesheet" href="lan-setup.css" />
  </head>
  <body>
    <main>
      <h1 id="title"></h1>
      <p id="intro"></p>
      <p id="note" class="note" role="status" aria-live="polite" hidden></p>

      <section id="steps">
        <section class="step">
          <h2 id="step-certificate"></h2>
          <div class="pair">
            <img id="download-qr" class="qr" alt="" />
            <div>
              <p id="step-certificate-body"></p>
              <p><code id="download-url"></code></p>
              <p><button id="save" type="button"></button></p>
              <p id="fingerprint-label" class="muted"></p>
              <p><code id="fingerprint" class="fingerprint"></code></p>
            </div>
          </div>
          <h3 id="platforms-heading"></h3>
          <dl id="platforms"></dl>
        </section>

        <section class="step">
          <h2 id="step-open"></h2>
          <div class="pair">
            <img id="address-qr" class="qr" alt="" />
            <div>
              <p id="step-open-body"></p>
              <p><code id="primary-url" class="primary"></code></p>
              <p id="other-label" class="muted"></p>
              <ul id="other-urls"></ul>
            </div>
          </div>
          <div class="warning">
            <h3 id="warning-heading"></h3>
            <p id="warning-body"></p>
            <p id="warning-recovery"></p>
          </div>
        </section>

        <section class="step replace">
          <h2 id="replace-heading"></h2>
          <p id="replace-body"></p>
          <p><button id="replace" type="button"></button></p>
        </section>
      </section>
    </main>
    <script src="lan-setup-page.js"></script>
  </body>
</html>
